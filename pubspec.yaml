name: eat_on_time
description: Умный хранитель сроков годности продуктов
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0

  # Backend & Sync
  supabase_flutter: ^2.0.0
  connectivity_plus: ^6.0.0

  # Local Storage
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0

  # ML & Scanning
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_barcode_scanning: ^0.12.0
  camera: ^0.11.0
  mobile_scanner: ^6.0.0

  # Voice
  speech_to_text: ^7.0.0

  # UI
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  workmanager: ^0.9.0

  # Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Utils
  uuid: ^4.0.0
  collection: ^1.18.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true

  # Мастер launcher-иконки хранится в assets/images, но не включается
  # в runtime bundle. Подключайте только реально используемые UI-ресурсы:
  # - assets/l10n/
