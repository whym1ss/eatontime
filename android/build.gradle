allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// isar_flutter_libs 3.1 predates the mandatory AGP namespace DSL.
// Keep the compatibility fix in the app instead of modifying the pub cache.
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        if (subproject.name == "isar_flutter_libs" &&
            subproject.android.namespace == null) {
            subproject.android.namespace = "dev.isar.isar_flutter_libs"
        }
        if (subproject.name == "isar_flutter_libs") {
            subproject.androidComponents.finalizeDsl { extension ->
                extension.compileSdk = 36
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
